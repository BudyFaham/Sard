<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية السرد - لوحة التحكم الذكية</title>
    
    <!-- أيقونة التبويب في المتصفح -->
    <link rel="icon" type="image/png" href="Sard.png">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="navbar">
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="brand-logo" onclick="toggleSidebar()" title="عرض السجل">
                <i class="icon-mask history-icon"></i>
            </div>
            <div class="brand-logo" onclick="createNewSession()" title="حلقة جديدة">
                <i class="icon-mask add-icon"></i>
            </div>
        </div>
        
        <div class="session-title-container">
            <input type="text" id="sessionTitleInput" class="top-session-input" oninput="handleTitleChange()" title="تغيير اسم الجلسة">
        </div>

        <div class="action-top-btns">
            <button class="btn-top" id="themeToggleBtn" onclick="toggleAppTheme()" title="تغيير الوضع">
                <img src="Dark_Mode.png" id="themeIconImg" class="theme-toggle-img" alt="وضع التبديل">
            </button>

            <button class="btn-top" onclick="takeScreenshot()" style="border-color: var(--accent-gold); color: var(--accent-gold); display: flex; align-items: center; justify-content: center;" title="الحفظ كصورة">
                <i class="icon-mask save-icon"></i>
            </button>
        </div>
    </div>

    <div class="capture-area" id="captureArea">
        <div class="dashboard">
            <div class="card card-full" id="mainCard">
                <h2>المؤقت الزمني</h2>
                
                <div class="stopwatch-display" id="display">
                    00:00:00<span class="ms" id="ms">.00</span>
                </div>
                
                <div class="controls">
                    <button id="mainBtn" class="btn-circle play-state" onclick="toggleStopwatch()" title="بدء / إيقاف">
                        <i id="mainIcon" class="icon-mask start-icon"></i>
                    </button>
                    
                    <button id="resetBtn" class="btn-circle btn-reset" onclick="resetStopwatch()" title="تصفير">
                        <i class="icon-mask restart-icon"></i>
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>الأخطاء</h2>
                <div class="counter-wrap">
                    <button class="btn-counter" onclick="updateCounter('mistakes', -1)">-</button>
                    <div class="counter-val val-red" id="mistakes">0</div>
                    <button class="btn-counter" onclick="updateCounter('mistakes', 1)">+</button>
                </div>
            </div>

            <div class="card">
                <h2>التنبيهات</h2>
                <div class="counter-wrap">
                    <button class="btn-counter" onclick="updateCounter('prompts', -1)">-</button>
                    <div class="counter-val val-cyan" id="prompts">0</div>
                    <button class="btn-counter" onclick="updateCounter('prompts', 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>السجل</h3>
            <div class="header-actions">
                <button class="close-sidebar" onclick="toggleSidebar()">&times;</button>
            </div>
        </div>
        <div class="sessions-list" id="sessionsList">
        </div>
    </div>

    <div class="custom-modal-overlay" id="customModalOverlay">
        <div class="custom-modal" id="customModal">
            <h3 id="modalTitle">عنوان النافذة</h3>
            <p id="modalMessage" style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px; display: none; line-height: 1.5;"></p>
            <div id="modalContentContainer"></div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">إلغاء</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">موافق</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
